[project]
name = "nordic-equity-features"
version = "0.1.0"
description = "Lookahead-safe intraday feature engineering for Nordic equities, with a synthetic-data demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "plotly>=5.0",
]
dagster = [
    "dagster>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nordic_equity_features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
